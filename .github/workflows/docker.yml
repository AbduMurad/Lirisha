name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Optional. Building on the server (`docker compose up -d --build`) needs no
# registry at all and is the simplest path for a single box. Use this workflow
# when you'd rather the server just pull a ready image — note that GHCR's free
# allowance for PRIVATE packages is small, and this image is ~750 MB, so either
# make the package public or build on the server instead.

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL || 'http://localhost:3000' }}

      - name: Smoke-test the image
        run: |
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker run -d --name smoke -p 3000:3000 \
            -e ADMIN_PASSWORD=smoke -e AUTH_SECRET=smoke-secret-long-enough \
            "$IMAGE"
          # the container migrates and seeds itself on a fresh volume
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health > /dev/null; then
              echo "healthy after ${i}s"; break
            fi
            sleep 1
          done
          curl -fsS http://localhost:3000/api/health
          curl -fsS -o /dev/null -w 'shop %{http_code}\n' http://localhost:3000/shop
          docker rm -f smoke
