# Lirisha — single-box deployment.
#
#   local        docker compose up -d --build          → http://localhost:3000
#   on a server  docker compose --profile edge up -d    → Caddy terminates TLS
#                                                         for $DOMAIN on 80/443
#
# SQLite lives on the `lirisha-data` volume and is the default: this shop's
# traffic does not justify a second container. When it does, start the
# `postgres` profile and point DATABASE_URL at it (see README → Deployment).

name: lirisha

services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    image: ${APP_IMAGE:-lirisha:local}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-file:/data/lirisha.db}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      WHATSAPP_NUMBER: ${WHATSAPP_NUMBER:-218910000000}
      SEED_ON_START: ${SEED_ON_START:-auto}
    volumes:
      - lirisha-data:/data
    ports:
      # Published only for the local/no-proxy case. Behind Caddy this is
      # unnecessary — comment it out on a public server so the app is not
      # reachable except through TLS.
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      # start_period covers migrate + first boot; after that, poll often. The
      # deploy waits on this verdict before it will roll back, so a slow
      # interval is time the shop spends serving a broken build.
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 3

  caddy:
    profiles: ["edge"]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env, e.g. lirisha.ly}
      TLS_EMAIL: ${TLS_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      # Opt-in extra site blocks. Empty by default; the Caddyfile's import glob
      # tolerates matching nothing.
      - ./docker/caddy.d:/etc/caddy/conf.d:ro
      - caddy-data:/data
      - caddy-config:/config

  # Container logs and stats in a browser, so "why did that order not arrive"
  # doesn't start with an SSH session and `docker logs --tail`. ~10 MB resident,
  # measured — it does not meaningfully compete with the app for the box's 2 GB.
  #
  #   docker compose --profile edge --profile tools up -d
  #
  # Bound to loopback on purpose. These logs carry customer names, phone numbers
  # and cities, and the socket exposes every container on the host, so it is not
  # something to publish by default. Reach it over an SSH tunnel:
  #
  #   ssh -N -L 8080:127.0.0.1:8080 root@<host>   → http://localhost:8080
  #
  # To put it on a subdomain instead, set DOZZLE_AUTH_PROVIDER=simple with a
  # users file (see README → Seeing what the box is doing) and add the route to
  # docker/Caddyfile. Never expose it with auth left at "none".
  logs:
    profiles: ["tools"]
    image: amir20/dozzle:v10
    restart: unless-stopped
    environment:
      DOZZLE_NO_ANALYTICS: "true"
      DOZZLE_LEVEL: ${DOZZLE_LEVEL:-info}
      # "none" is only safe while this is loopback-only. Set to "simple" before
      # putting it behind Caddy.
      DOZZLE_AUTH_PROVIDER: ${DOZZLE_AUTH_PROVIDER:-none}
      # Empty shows every container on the host. Narrow it with e.g.
      # label=com.docker.compose.project=lirisha
      DOZZLE_FILTER: ${DOZZLE_FILTER:-}
    volumes:
      # Read-only, and --enable-actions/--enable-shell are left off, so this can
      # observe the host's containers but not touch them.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - dozzle-data:/data
    ports:
      - "${DOZZLE_BIND:-127.0.0.1:8080}:8080"
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Only needed once SQLite stops being enough. Start with:
  #   docker compose --profile postgres up -d
  # then set DATABASE_URL=postgresql://lirisha:...@db:5432/lirisha
  # and switch the provider in prisma/schema.prisma.
  db:
    profiles: ["postgres"]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lirisha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lirisha}
      POSTGRES_DB: lirisha
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lirisha"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  lirisha-data:
  caddy-data:
  caddy-config:
  dozzle-data:
  pg-data:
